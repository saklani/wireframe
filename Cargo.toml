[package]
name = "wireframe"
version = "0.1.0"
edition = "2021"
description = "Draw UI wireframes as screen mockups in the terminal, from an indented outline"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
terminal_size = "0.4"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
overflow-checks = true
lto = true
strip = true

[lints.clippy]
must_use_candidate = "warn"
missing_errors_doc = "warn"
needless_pass_by_value = "warn"
needless_for_each = "warn"
single_match_else = "warn"
